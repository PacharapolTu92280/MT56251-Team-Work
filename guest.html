<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT56251 | Guest Request</title><style>*{box-sizing:border-box}body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#f4f5f7;color:#252b34}header{border-top:5px solid #d7193f;background:white;padding:18px 24px;font-weight:700;font-size:20px}main{max-width:720px;margin:35px auto;background:white;border:1px solid #e5e7eb;border-radius:14px;padding:25px;box-shadow:0 3px 14px #0001}h1{font-size:23px}label{display:block;margin:14px 0 5px;font-weight:600;font-size:13px}input,select,textarea{width:100%;border:1px solid #cfd3da;border-radius:7px;padding:10px;font:inherit}textarea{min-height:105px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,.back{display:inline-block;background:#d7193f;color:white;border:0;border-radius:7px;padding:11px 15px;cursor:pointer;font:inherit;text-decoration:none}button:disabled{opacity:.5}.back{background:#eef0f3;color:#252b34}.hint{color:#667085;font-size:13px}.error{color:#b42335}.success{color:#157347}#result{margin-top:15px;overflow-wrap:anywhere}@media(max-width:600px){main{margin:10px;padding:17px}.row{grid-template-columns:1fr}}</style></head><body><header>MT56251 | Team Work Management</header><main><h1>Guest – ขอรับบริการ / Request New Task</h1><p class="hint">ไม่ต้องสมัครบัญชี · คำขอจะถูกส่งให้ Admin พิจารณา · ไม่สามารถดูข้อมูลภายในทีมได้</p><form id="guestForm"><div class="row"><div><label>ชื่อผู้ร้องขอ *</label><input id="requesterName" maxlength="100" required></div><div><label>อีเมลติดต่อกลับ *</label><input id="contactEmail" type="email" maxlength="254" required></div></div><label>ชื่องาน *</label><input id="taskTitle" maxlength="200" required><div class="row"><div><label>ประเภทงาน</label><select id="category"><option>Daily Operations</option><option>Project Response</option><option>Process Improvement</option></select></div><div><label>Priority ที่เสนอ</label><select id="priority"><option value="P1">P1 – Critical</option><option value="P2">P2 – High</option><option value="P3" selected>P3 – Medium</option><option value="P4">P4 – Low</option></select></div></div><label>Requested Due Date</label><input id="dueDate" type="date"><label>รายละเอียด / เหตุผล</label><textarea id="details" maxlength="3000"></textarea><p class="hint">กรุณายืนยัน CAPTCHA เพื่อป้องกันการส่งคำขออัตโนมัติ</p><div id="turnstileWidget"></div><p><button id="submitBtn" type="submit">ส่งคำขอ</button> <a class="back" href="index.html">กลับหน้า Login</a></p><p id="result" role="status" aria-live="polite"></p></form></main><script src="config.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><script src="guest.js"></script></body></html>
