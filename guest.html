<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MT56251 | Guest Request</title><style>*{box-sizing:border-box}body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#f4f5f7;color:#252b34}header{border-top:5px solid #d7193f;background:white;padding:18px 24px;font-weight:700;font-size:20px}main{max-width:720px;margin:35px auto;background:white;border:1px solid #e5e7eb;border-radius:14px;padding:25px;box-shadow:0 3px 14px #0001}h1{font-size:23px}label{display:block;margin:14px 0 5px;font-weight:600;font-size:13px}input,select,textarea{width:100%;border:1px solid #cfd3da;border-radius:7px;padding:10px;font:inherit}textarea{min-height:105px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}button,.back{display:inline-block;background:#d7193f;color:white;border:0;border-radius:7px;padding:11px 15px;cursor:pointer;font:inherit;text-decoration:none}button:disabled{opacity:.5}.back{background:#eef0f3;color:#252b34}.hint{color:#667085;font-size:13px}.error{color:#b42335}.success{color:#157347}#result{margin-top:15px;overflow-wrap:anywhere}@media(max-width:600px){main{margin:10px;padding:17px}.row{grid-template-columns:1fr}}.guest-tabs{display:flex;gap:8px;margin:18px 0}.guest-tab{background:#eef0f3;color:#252b34}.guest-tab.active{background:#d7193f;color:white}.guest-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.guest-controls select{width:auto;margin-left:auto}.guest-calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.guest-cal-head{text-align:center;font-size:12px;color:#667085;padding:7px}.guest-cal-day{border:1px solid #e0e2e6;min-height:95px;border-radius:5px;padding:5px;min-width:0}.guest-cal-day.outside{background:#f4f5f7}.guest-cal-day b{font-size:12px}.guest-task{display:block;margin-top:5px;background:#fce8ec;color:#8c1730;border-left:3px solid #d7193f;padding:5px;font-size:11px;border-radius:3px;overflow-wrap:anywhere}.guest-agenda{grid-column:1/-1}.guest-agenda-day{border:1px solid #e0e2e6;padding:12px;margin-bottom:10px;border-radius:8px}@media(max-width:600px){.guest-cal-day{min-height:72px;padding:3px}.guest-task{font-size:10px;padding:3px}.guest-controls select{margin-left:0}}</style></head><body><header>MT56251 | Team Work Management</header><main><h1>Guest – ขอรับบริการ / Request New Task</h1><p class="hint">ไม่ต้องสมัครบัญชี · คำขอจะถูกส่งให้ Admin พิจารณา · ไม่สามารถดูข้อมูลภายในทีมได้</p><div class="guest-tabs"><button type="button" id="showGuestRequest" class="guest-tab active">Request Task</button><button type="button" id="showGuestCalendar" class="guest-tab">Calendar (Read Only)</button></div><section id="guestCalendarView" hidden><div class="guest-controls"><button type="button" id="guestPrev">◀</button><strong id="guestMonthTitle"></strong><button type="button" id="guestNext">▶</button><select id="guestCalendarMode" aria-label="มุมมองปฏิทิน"><option value="month">Month</option><option value="week">Week</option><option value="day">Day</option></select></div><p class="hint">แสดงเฉพาะงานที่ Admin อนุญาต ไม่แสดงข้อมูลภายในทีม</p><p id="guestCalendarMessage" role="status" class="hint"></p><div id="guestCalendarGrid" class="guest-calendar-grid"></div></section><div id="guestRequestView"><form id="guestForm"><div class="row"><div><label>ชื่อผู้ร้องขอ *</label><input id="requesterName" maxlength="100" required></div><div><label>อีเมลติดต่อกลับ *</label><input id="contactEmail" type="email" maxlength="254" required></div></div><label>ชื่องาน *</label><input id="taskTitle" maxlength="200" required><div class="row"><div><label>ประเภทงาน</label><select id="category"><option>Daily Operations</option><option>Project Response</option><option>Process Improvement</option></select></div><div><label>Priority ที่เสนอ</label><select id="priority"><option value="P1">P1 – Critical</option><option value="P2">P2 – High</option><option value="P3" selected>P3 – Medium</option><option value="P4">P4 – Low</option></select></div></div><label>Requested Due Date</label><input id="dueDate" type="date"><label>รายละเอียด / เหตุผล</label><textarea id="details" maxlength="3000"></textarea><p class="hint">กรุณายืนยัน CAPTCHA เพื่อป้องกันการส่งคำขออัตโนมัติ</p><div id="turnstileWidget"></div><p><button id="submitBtn" type="submit">ส่งคำขอ</button> <a class="back" href="index.html">กลับหน้า Login</a></p><p id="result" role="status" aria-live="polite"></p></form></div></main><script src="config.js"></script><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script><script src="guest.js"></script><script src="guest-calendar.js"></script></body></html>
